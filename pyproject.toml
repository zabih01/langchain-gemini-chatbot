[project]
name = "langchain-gemini-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "yourgmail@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "tzdata>=2026.5",
]

[project.scripts]
langchain-gemini-chatbot = "langchain_gemini_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
